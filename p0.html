<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- §9: يملأ البناءُ هذه الوسوم لكل لغز (الرابط الحقيقي للصورة يُستضاف فعليًا) -->
<meta property="og:title" content="تحدّي اليوم: هل تعرف الإجابة؟">
<meta property="og:description" content="سؤالان سريعان — اضغط وجرّب">
<meta property="og:image" content="https://example.com/og.png">

<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&family=Amiri:wght@400;700&family=Lalezar&family=El+Messiri:wght@500;700&family=Cairo:wght@500;700&family=Tajawal:wght@500;700;800&family=Katibeh&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);display:grid;place-items:center;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--violet) 28%,transparent) 0,transparent 45%),radial-gradient(circle at 88% 92%,color-mix(in srgb,var(--cyan) 24%,transparent) 0,transparent 42%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.card{width:var(--w,min(92vw,380px));min-height:var(--h,0);max-width:100%;background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid color-mix(in srgb,var(--violet) 35%,transparent);border-radius:28px;padding:16px;
 box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.card.full{border-radius:0;justify-content:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1.7rem}
.back-btn{border:0;border-radius:999px;background:var(--cyan);color:var(--on);font:inherit;font-weight:700;padding:6px 14px;cursor:pointer}
.q{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.6}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ls{display:inline-flex;align-items:center;border:0;border-radius:999px;background:var(--violet);color:var(--on);font:inherit;font-weight:700;padding:5px 14px;cursor:pointer;transition:transform .12s}
.ls::before{content:'';width:.6em;height:.6em;border-radius:50%;background:currentColor;margin-inline-end:.5em}
.ls.on::before{border-radius:2px}
.ls:active{transform:scale(.92)}
.ls[data-st=prep]::before,.ls[data-st=play]::before{animation:pulse .8s infinite}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 14px;border:2px solid var(--violet);border-radius:18px;
 background:var(--tint,var(--paper));color:var(--ink);cursor:pointer;animation:floaty 3s ease-in-out infinite}
.opt:nth-child(2){animation-delay:-.7s}.opt:nth-child(3){animation-delay:-1.4s}.opt:nth-child(4){animation-delay:-2.1s}
.opt:hover{background:var(--yellow);color:#1b1206}
.opt.ok{background:var(--cyan);color:var(--on);animation:cele .5s both}
.opt.bad{background:var(--pink);color:#fff;animation:shake .4s}
.go{border:0;border-radius:20px;background:var(--pink);color:#fff;font:inherit;font-weight:800;font-size:1.3rem;padding:14px;cursor:pointer}
.go:disabled{opacity:.5}
.msg{min-height:1.6em;font-weight:800;text-align:center;white-space:pre-line}
.card.cele{animation:cele .6s both}
.ad{border:2px dashed var(--ink);border-radius:14px;padding:8px;background:var(--cyan);color:var(--on)}
.ad-label{display:inline-block!important;visibility:visible!important;opacity:1!important;font-size:.75rem;font-weight:700;
 background:Canvas;color:CanvasText;padding:0 6px;border-radius:6px;margin-inline-end:6px}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.pick{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline-start:12px;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;background:#fff;color:#222;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:9}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-3px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes cele{40%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.opts.grid,.opts.mosaic{grid-template-columns:1fr 1fr}
.opts.circles{grid-template-columns:1fr 1fr;justify-items:center;gap:14px}
.opts.circles .opt{width:min(36vw,136px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:8px}
.opts.mosaic .opt:nth-child(1){grid-column:span 2;border-radius:28px 8px 28px 8px}
.opts.mosaic .opt:nth-child(2){border-radius:8px 28px 8px 28px}
.opts.mosaic .opt:nth-child(3){border-radius:28px}
.opts.mosaic .opt:nth-child(4){grid-column:span 2;border-radius:8px 28px 8px 28px}
.mz{display:block;width:100%;touch-action:none;user-select:none;border-radius:16px}
.mz .w{fill:var(--violet)}.mz .p{fill:var(--paper)}
.mz text{font-family:var(--font);font-weight:700;font-size:3.1px;fill:var(--ink)}
.mz polyline{fill:none;stroke:var(--cyan);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.mz circle{fill:var(--yellow);stroke:var(--violet);stroke-width:.8;animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.mz-bad{animation:shake .4s}
.pick.p2{bottom:calc(58px + env(safe-area-inset-bottom))}
.as{display:block;width:100%;touch-action:none;user-select:none;border-radius:16px;background:var(--paper)}
.as .ghost{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.6;stroke-dasharray:4 3}
.as .pc{cursor:grab;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.as .pc.locked{cursor:default;filter:none;opacity:.98}
.as .pc:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.as-bad{animation:shake .35s}
</style>
</head>

   {id:'flag',d:'M0 0 L26 8 L0 16 Z',fill:'pink',x:248,y:148,tx:95,ty:0,label:{ar:'العلَم',en:'Flag'}}
  ]}}];
const PUZZLE=PUZZLES[+new URLSearchParams(location.search).get('p')||0]||PUZZLES[0];

/* ===== 4) أدوات الـCore ===== */
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const det=()=>(navigator.language||'ar').slice(0,2).toLowerCase(),has=l=>UI[l]?l:'ar';
const uiLoc=PUZZLE.translatable===false?'ar':has(det());
const cLoc=(PUZZLE.translatable===true&&!PUZZLE.containsSacred)?has(det()):'ar'; /* بوابة الترجمة + قفل المقدّس */
const U=UI[uiLoc];
document.documentElement.lang=uiLoc;
document.documentElement.dir=['ar','he','fa','ur'].includes(uiLoc)?'rtl':'ltr';
function theme(el,t){for(const k in t.colors)el.style.setProperty('--'+k,t.colors[k]);if(t.font)el.style.setProperty('--font',t.font);if(t.display)el.style.setProperty('--display',t.display);(t.t||[]).forEach((c,k)=>el.style.setProperty('--t'+(k+1),c))}
BRAND.theme=pickTheme(PUZZLE);
theme(document.documentElement,BRAND.theme);

const Core={
 types:{},ui:U,
 register(t,f){this.types[t]=f},               /* مبدأ Open/Closed: نوع جديد بلا تعديل قائم */
 getLocale:()=>cLoc,getDifficultyLevel:()=>null,
 AU:{on:false,st:'idle',tok:0,subs:[]},
 sub(f){Core.AU.subs.push(f);return()=>{Core.AU.subs=Core.AU.subs.filter(x=>x!==f)}},
 au(o){Object.assign(Core.AU,o);Core.AU.subs.slice().forEach(f=>f())},
 setAudio(on){if(!on)Core.stop();Core.au({on})},
 stop(){Core.AU.tok++;try{Core._a&&Core._a.pause()}catch(_){}try{window.speechSynthesis.cancel()}catch(_){}Core.au({st:'idle'})},
 preload(src){const a=new Audio();a.preload='auto';a.src=src;(Core._pre=Core._pre||{})[src]=a},
 play(text,loc,src){                            /* ملف صوتي جاهز (مسجَّل أو مولَّد بجودة عالية): أسرع وأجمل من صوت المتصفح */
  const A=Core.AU,tok=++A.tok;Core.au({st:'prep'});
  try{window.speechSynthesis&&window.speechSynthesis.cancel();Core._a&&Core._a.pause()}catch(_){}
  const a=Core._a=(Core._pre&&Core._pre[src])||new Audio(src);try{a.currentTime=0}catch(_){}
  a.onplaying=()=>tok===A.tok&&Core.au({st:'play'});
  a.onended=()=>tok===A.tok&&Core.au({st:'idle'});
  a.onerror=()=>tok===A.tok&&Core.speak(text,loc);   /* الملف مفقود: سقوط أنيق إلى صوت المتصفح */
  const p=a.play();if(p&&p.catch)p.catch(()=>tok===A.tok&&Core.speak(text,loc))
 },
 bar(q,src,extra){                              /* شريط «استمع/إيقاف» المشترك بين كل المفاصل */
  const b=$('div','bar'),ls=$('button','ls');ls.type='button';
  const paint=()=>{const A=Core.AU;ls.textContent=A.on?U.stop:U.listen;ls.className='ls'+(A.on?' on':'');ls.dataset.st=A.st;ls.setAttribute('aria-pressed',A.on)};
  const off=Core.sub(paint);paint();
  ls.onclick=()=>{if(Core.AU.on)Core.setAudio(false);else{Core.setAudio(true);Core.speak(q,cLoc,src)}};
  b.append(ls);if(extra)b.append(extra);return{el:b,off}
 },
 speak(text,loc=cLoc,src){                          /* §3.6: تحقق من وجود الصوت، وسقوط أنيق بلا صوت */
  if(src)return Core.play(text,loc,src);
  try{Core._a&&Core._a.pause()}catch(_){}
  const s=window.speechSynthesis,A=Core.AU;if(!s)return Core.au({on:false});
  const tok=++A.tok;Core.au({st:'prep'});let d=0;
  const run=()=>{if(d||tok!==A.tok)return;d=1;
   const c=s.getVoices().filter(x=>x.lang.toLowerCase().startsWith(loc));
   const v=c.find(x=>BRAND.voiceId&&x.name===BRAND.voiceId)||c.find(x=>/natural|online|neural/i.test(x.name))||c[0];
   if(!v)return Core.au({st:'idle',on:false});
   s.cancel();
   setTimeout(()=>{if(tok!==A.tok)return;
    const u=Core._u=new SpeechSynthesisUtterance(text);u.voice=v;u.lang=v.lang;
    u.onstart=()=>tok===A.tok&&Core.au({st:'play'});
    u.onend=u.onerror=()=>tok===A.tok&&Core.au({st:'idle'});
    s.resume();s.speak(u)},80)};
  if(s.getVoices().length)run();else{s.addEventListener('voiceschanged',run,{once:true});setTimeout(run,1200)}
 }
};

/* ===== 5) مدقّق القواعد (§4): أي مخالفة = رفض البناء ===== */
const SACRED_OK=['اختيار','ترتيب','توصيل هادئ'];
const ASSETS_OK=['سفن','خرائط','جبال','دراجات','غابات','أشكال هندسية'];
const REQ=['id','contentId','version','type','difficultyVariants','translatable','containsSacred','containsImagery','timerEnabled','adSlot','noWrongAnswer'];
function lint(c){
 const e=[];
 REQ.forEach(k=>{if(!(k in c))e.push('§2.1 حقل ناقص: '+k)});
 if(['requireFollow','requireMention','requireDM','gate'].some(k=>k in c))e.push('§4.1 ممنوع حجب النتيجة بشرط متابعة/نشر');
 if(c.id===c.contentId)e.push('§4.2 يجب أن يختلف id عن contentId، وأن يكون فريدًا لكل نشر');
 if(c.containsImagery&&!(c.assets||[]).every(a=>ASSETS_OK.includes(a)))e.push('§4.3 أصل بصري غير مسموح');
 if(c.containsSacred&&!SACRED_OK.includes(c.type))e.push('§4.4 آلية غير موقَّرة لمحتوى مقدّس');
 if(c.season&&c.seasonSource!=='manual')e.push('§4.5 المواسم يدوية فقط');
 if(c.captcha&&!(c.prize||c.competitive))e.push('§4.10 captcha محظور خارج الجوائز/التنافس العلني');
 if(c.usesSensors&&!c.fallback)e.push('§4.11 يلزم بديل بلا حساسات');
 if(!Core.types[c.type])e.push('نوع آلية غير مسجَّل: '+c.type);
 return e;
}

/* ===== 6) مفصل «اختيار» (يدعم خطوة واحدة أو عدة خطوات) ===== */
Core.register('اختيار',(cfg,ev,core)=>{
 const to=[],offs=[];let i=0,tries=0,t0=0,root,locked=false,unsub;
 const tx=o=>o[core.getLocale()]||o.ar,say=s=>core.speak(tx(s.q),core.getLocale(),s.audio&&s.audio[core.getLocale()]),later=(f,ms)=>to.push(setTimeout(f,ms));
 function show(){
  const s=cfg.steps[i];locked=false;tries=0;root.replaceChildren();
  const q=$('h1','q');q.textContent=tx(s.q);
  const ol=$('div','opts '+(s.layout||cfg.layout||'list'));ol.setAttribute('role','group');ol.setAttribute('aria-label',q.textContent);
  s.o.forEach((o,k)=>{const b=$('button','opt');b.type='button';b.textContent=tx(o.t);
   b.style.setProperty('--tint',o.tint||'var(--t'+(k%4+1)+')');if(o.css)b.style.cssText+=o.css;   /* أي شكل/حجم/لون لخانة بعينها */
   b.onclick=()=>pick(b,o);ol.append(b)});
  /* مقصود لا خطأ: بلا أي dir على n، الرقمان "الحالي/الكل" ينعكسان بصريًا تلقائيًا داخل سياق RTL —
     فيظهر الحالي يمين المجموعة (أول ما تقع عليه العين عربيًا) والكل يسارها؛ في LTR يبقيان كما كُتبا (الحالي يسارًا).
     لا تُضِف dir هنا ظنًّا منك أنه إصلاح؛ ستُلغي الأثر المقصود. */
  let n;if(cfg.steps.length>1){n=$('span');n.textContent=core.ui.step(i+1,cfg.steps.length)}
  unsub&&unsub();const bar=core.bar(q.textContent,s.audio&&s.audio[core.getLocale()],n);unsub=bar.off;
  root.append(bar.el,q,ol);
  if(i>0)ol.firstChild.focus();
 }
 function pick(b,o){
  if(locked)return;const ms=performance.now()-t0;
  if(cfg.noWrongAnswer||o.ok){
   locked=true;b.classList.add('ok');ev.onStepCorrect(i,ms);
   if(i<cfg.steps.length-1)later(()=>{i++;show();if(core.AU.on)say(cfg.steps[i])},500);
   else ev.onModuleComplete(ms);   /* الاحتفال والعودة بعد الخطوة الأخيرة فقط */
  }else{tries++;b.classList.add('bad');later(()=>b.classList.remove('bad'),450);ev.onStepIncorrect(i,tries)}
 }
 return{
  mount(r){root=r;show();cfg.steps.forEach(s=>{const u=s.audio&&s.audio[core.getLocale()];if(u)core.preload(u)});
   const kd=e=>{const b=[...root.querySelectorAll('.opt')],j=b.indexOf(document.activeElement),d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];
    if(j<0||!d)return;e.preventDefault();b[(j+d+b.length)%b.length].focus()};
   r.addEventListener('keydown',kd);offs.push(()=>r.removeEventListener('keydown',kd));
   ev.onReady()},
  start(){t0=performance.now();ev.onModuleStart()},
  destroy(){unsub&&unsub();to.forEach(clearTimeout);to.length=0;offs.forEach(f=>f());offs.length=0}
 };
});

/* ===== مفصل «متاهة»: حرّك إصبعك من النقطة الصفراء إلى المخرج الصحيح (ممرات بعرض خلية كاملة تتسع للإصبع) ===== */
Core.register('متاهة',(cfg,ev,core)=>{
 const M=cfg.maze,G=M.grid,R=G.length,C=G[0].length,U=10,E=M.exits,K=Object.keys(E),to=[],offs=[];
 const tx=o=>o[core.getLocale()]||o.ar,later=(f,ms)=>to.push(setTimeout(f,ms));
 let svg,line,dot,unsub,t0=0,S=[0,0],pos,trail,last,down=0,dead=0,done=0,tries=0;
 const at=(r,c)=>(G[r]||'')[c]||'#',ctr=(r,c)=>[c*U+U/2,r*U+U/2];
 const draw=()=>{line.setAttribute('points',trail.map(p=>p.join(',')).join(' '));const p=trail[trail.length-1];dot.setAttribute('cx',p[0]);dot.setAttribute('cy',p[1])};
 const reset=()=>{pos=S.slice();trail=[ctr(S[0],S[1])];dead=0;draw()};
 function fail(){if(dead)return;dead=1;tries++;svg.classList.add('mz-bad');ev.onStepIncorrect(0,tries);later(()=>{svg.classList.remove('mz-bad');reset()},450)}
 function enter(r,c){                              /* يدخل خلية: 0 = جدار */
  const ch=at(r,c);if(ch==='#')return 0;if(r===pos[0]&&c===pos[1])return 1;
  pos=[r,c];trail.push(ctr(r,c));draw();const x=E[ch];
  if(x){if(x.ok){if(!done){done=1;const ms=performance.now()-t0;ev.onStepCorrect(0,ms);ev.onModuleComplete(ms)}}else fail()}
  return 1}
 const pt=e=>{const b=svg.getBoundingClientRect();return[(e.clientX-b.left)/b.width*C,(e.clientY-b.top)/b.height*R]};
 const walk=p=>{const a=last,n=Math.max(1,Math.ceil(Math.hypot(p[0]-a[0],p[1]-a[1])*4));
  for(let k=1;k<=n&&!dead&&!done;k++){const q=[a[0]+(p[0]-a[0])*k/n,a[1]+(p[1]-a[1])*k/n];if(!enter(Math.floor(q[1]),Math.floor(q[0])))return fail()}
  last=p};
 const H={
  pointerdown:e=>{if(done)return;const p=pt(e);if(at(Math.floor(p[1]),Math.floor(p[0]))!=='S')return;
   try{svg.setPointerCapture(e.pointerId)}catch(_){}svg.focus({preventScroll:true});down=1;reset();last=p;e.preventDefault()},
  pointermove:e=>{if(down&&!dead&&!done)walk(pt(e))},
  pointerup:()=>{down=0;if(!done&&!dead)reset()},
  pointercancel:()=>{down=0;if(!done&&!dead)reset()},
  keydown:e=>{const d={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];   /* بديل لوحة المفاتيح */
   if(!d||done||dead)return;e.preventDefault();enter(pos[0]+d[0],pos[1]+d[1])}
 };
 return{
  mount(r){const s=cfg.steps[0],q=$('h1','q');q.textContent=tx(s.q);let h='';
   for(let a=0;a<R;a++)for(let b=0;b<C;b++){const ch=at(a,b),x=b*U,y=a*U,e=E[ch];if(ch==='S')S=[a,b];
    h+=ch==='#'?`<rect class="w" x="${x}" y="${y}" width="${U}" height="${U}" rx="2"/>`:`<rect class="p" x="${x}" y="${y}" width="${U}" height="${U}"/>`;
    if(e)h+=`<rect x="${x}" y="${y}" width="${U}" height="${U}" rx="2" style="fill:var(--t${K.indexOf(ch)%4+1})"/><text x="${x+U/2}" y="${y+U/2}" text-anchor="middle" dominant-baseline="central">${tx(e.t)}</text>`}
   const w=$('div');w.innerHTML=`<svg class="mz" viewBox="0 0 ${C*U} ${R*U}" tabindex="0" role="application">${h}<polyline points=""/><circle r="3.4"/></svg>`;
   svg=w.firstChild;svg.setAttribute('aria-label',q.textContent);line=svg.querySelector('polyline');dot=svg.querySelector('circle');
   for(const k in H){svg.addEventListener(k,H[k]);offs.push(()=>svg.removeEventListener(k,H[k]))}
   const u=s.audio&&s.audio[core.getLocale()];if(u)core.preload(u);
   const b=core.bar(q.textContent,u);unsub=b.off;r.append(b.el,q,svg);reset();ev.onReady()},
  start(){t0=performance.now();ev.onModuleStart()},
  destroy(){unsub&&unsub();to.forEach(clearTimeout);to.length=0;offs.forEach(f=>f());offs.length=0}
 };
});

/* ===== مفصل «تركيب»: اسحب كل قطعة إلى مخططها الشبحي؛ Enter/Space على القطعة المركَّزة = وضعها فورًا (بديل الحساسات/اللمس) ===== */
Core.register('تركيب',(cfg,ev,core)=>{
 const A=cfg.assemble,NS='http://www.w3.org/2000/svg',to=[],offs=[];
 const tx2=o=>o[core.getLocale()]||o.ar,later=(f,ms)=>to.push(setTimeout(f,ms));
 let svg,unsub,t0=0,left=A.pieces.length,tries=0;
 const near=(a,b,c,d)=>Math.hypot(a-c,b-d)<22;
 const setPos=(g,x,y)=>g.setAttribute('transform',`translate(${x},${y})`);
 function place(g,p,ok){
  if(ok){p.locked=1;g.classList.add('locked');g.removeAttribute('tabindex');setPos(g,p.tx,p.ty);left--;
   if(!left){const ms=performance.now()-t0;ev.onStepCorrect(0,ms);ev.onModuleComplete(ms)}}
  else{tries++;svg.classList.add('as-bad');ev.onStepIncorrect(0,tries);setPos(g,p.x,p.y);later(()=>svg.classList.remove('as-bad'),350)}
 }
 return{
  mount(r){const s0=cfg.steps[0],q=$('h1','q');q.textContent=tx2(s0.q);
   const el=document.createElementNS(NS,'svg');el.setAttribute('class','as');el.setAttribute('viewBox',`0 0 ${A.w} ${A.h}`);
   el.setAttribute('role','group');el.setAttribute('aria-label',q.textContent);svg=el;
   A.pieces.forEach(p=>{
    const gh=document.createElementNS(NS,'path');gh.setAttribute('class','ghost');gh.setAttribute('d',p.d);
    gh.setAttribute('transform',`translate(${p.tx},${p.ty})`);el.appendChild(gh);
   });
   A.pieces.forEach(p=>{
    const g=document.createElementNS(NS,'g');g.setAttribute('class','pc');g.setAttribute('tabindex','0');
    g.setAttribute('role','button');g.setAttribute('aria-label',tx2(p.label));setPos(g,p.x,p.y);
    const sh=document.createElementNS(NS,'path');sh.setAttribute('d',p.d);sh.style.fill=`var(--${p.fill})`;g.appendChild(sh);el.appendChild(g);
    let ox=0,oy=0,sx=0,sy=0,on=0;
    const pd=e=>{if(p.locked)return;on=1;g.setPointerCapture(e.pointerId);g.focus({preventScroll:true});
     const m=pt(e);sx=m[0];sy=m[1];const t=g.transform.baseVal.getItem(0).matrix;ox=t.e;oy=t.f;e.preventDefault()};
    const pt=e=>{const b=svg.getBoundingClientRect();return[(e.clientX-b.left)/b.width*A.w,(e.clientY-b.top)/b.height*A.h]};
    const pm=e=>{if(!on)return;const m=pt(e);setPos(g,ox+m[0]-sx,oy+m[1]-sy)};
    const pu=()=>{if(!on)return;on=0;const t=g.transform.baseVal.getItem(0).matrix;place(g,p,near(t.e,t.f,p.tx,p.ty))};
    const kd=e=>{if(p.locked||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();place(g,p,true)};
    g.addEventListener('pointerdown',pd);g.addEventListener('pointermove',pm);
    g.addEventListener('pointerup',pu);g.addEventListener('pointercancel',pu);g.addEventListener('keydown',kd);
    offs.push(()=>{g.removeEventListener('pointerdown',pd);g.removeEventListener('pointermove',pm);
     g.removeEventListener('pointerup',pu);g.removeEventListener('pointercancel',pu);g.removeEventListener('keydown',kd)});
   });
   const b=core.bar(q.textContent);unsub=b.off;r.append(b.el,q,el);ev.onReady()},
  start(){t0=performance.now();ev.onModuleStart()},
  destroy(){unsub&&unsub();to.forEach(clearTimeout);to.length=0;offs.forEach(f=>f());offs.length=0}
 };
});

/* ===== 7) الإقلاع: بناء الحاوية، تدفق العودة، العدّاد، الإعلان ===== */
(function boot(){
 document.title=BRAND.name;try{speechSynthesis.getVoices()}catch(_){}
 const card=document.getElementById('card');let mod,done=false,t0=0;
 card.innerHTML=`<div class="top"><div class="brand">${BRAND.mascotIcon}<span></span></div><button class="back-btn" type="button"></button></div>`;
 card.querySelector('.brand span').textContent=BRAND.name;
 const back=card.querySelector('.back-btn');back.textContent=U.back;
 if(BUILD.designPicker){let k=0;const b=$('button','pick');b.type='button';
  const up=()=>{b.textContent='🎨 '+(k+1)+'/'+LOOKS.length+' — '+LOOKS[k].n};
  b.onclick=()=>{k=(k+1)%LOOKS.length;theme(document.documentElement,LOOKS[k]);up()};up();document.body.append(b);
  const pi=PUZZLES.indexOf(PUZZLE),b2=$('button','pick p2');b2.type='button';b2.textContent='🧩 '+(pi+1)+'/'+PUZZLES.length+' — '+PUZZLE.type;
  b2.onclick=()=>{location.search='?p='+((pi+1)%PUZZLES.length)};document.body.append(b2)}
 const sz=BUILD.size;
 if(sz==='full'){card.style.setProperty('--w','100vw');card.style.setProperty('--h','100dvh');card.classList.add('full')}
 else if(sz&&sz.w){card.style.setProperty('--w',sz.w);card.style.setProperty('--h',sz.h)}
 const errs=lint(PUZZLE);
 if(errs.length){const p=$('div','msg');p.textContent=U.rejected+'\n'+errs.join('\n');card.append(p);return}
 const host=$('div');host.hidden=true;
 const go=$('button','go');go.type='button';go.textContent=U.start;go.disabled=true;
 const msg=$('p','msg');msg.setAttribute('aria-live','polite');
 card.append(host,go,msg);
 const mkAd=()=>{const a=$('aside','ad','<span class="ad-label"></span><span></span>');
  a.firstChild.textContent=U.ad;a.lastChild.textContent=PUZZLE.ad?(PUZZLE.ad[cLoc]||PUZZLE.ad.ar):'';
  if(BUILD.sponsorTheme)theme(PUZZLE.adSlot==='fullCard'?card:a,BUILD.sponsorTheme);return a};
 if(PUZZLE.adSlot==='inline'||PUZZLE.adSlot==='fullCard')card.insertBefore(mkAd(),go);
 function leave(){try{mod&&mod.destroy()}catch(_){}
  if(window.speechSynthesis)window.speechSynthesis.cancel();location.href=BUILD.returnUrl}
 const ev={
  onReady(){go.disabled=false},
  onModuleStart(){t0=performance.now()},
  onStepCorrect(){},onStepIncorrect(){},
  onModuleComplete(ms){
   if(done)return;done=true;
   const s=Math.round((t0?performance.now()-t0:ms)/1000);
   msg.textContent=PUZZLE.noWrongAnswer?U.opinion:(PUZZLE.timerEnabled?U.done(s):U.ok);
   card.classList.add('cele');
   if(PUZZLE.adSlot==='postAnswer')card.insertBefore(mkAd(),msg);
   setTimeout(leave,BUILD.celebrateMs)},
  onExitRequested(){leave()}
 };
 back.onclick=()=>ev.onExitRequested();
 mod=Core.types[PUZZLE.type](PUZZLE,ev,Core);mod.mount(host);
 go.onclick=()=>{go.remove();host.hidden=false;mod.start()};go.click();   /* ضغطة المستخدم تفتح النطق (§3.6) */
 addEventListener('pagehide',()=>mod.destroy());
})();
</script>
