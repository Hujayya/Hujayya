<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--ink);display:grid;place-items:center;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
 background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--violet) 28%,transparent) 0,transparent 45%),radial-gradient(circle at 88% 92%,color-mix(in srgb,var(--cyan) 24%,transparent) 0,transparent 42%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.card{width:var(--w,min(92vw,380px));min-height:var(--h,0);max-width:100%;background:linear-gradient(160deg,var(--card1),var(--card2));border:1px solid color-mix(in srgb,var(--violet) 35%,transparent);border-radius:28px;padding:16px;
 box-shadow:0 24px 60px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.3) both}
.card.full{border-radius:0;justify-content:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--display);font-weight:700;font-size:1.7rem}
.back-btn{border:0;border-radius:999px;background:var(--cyan);color:var(--on);font:inherit;font-weight:700;padding:6px 14px;cursor:pointer}
.ptimer{font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem;color:var(--ink);opacity:.75;min-width:2.4em;text-align:center}
.q{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.6}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.ls{display:inline-flex;align-items:center;border:0;border-radius:999px;background:var(--violet);color:var(--on);font:inherit;font-weight:700;padding:5px 14px;cursor:pointer;transition:transform .12s}
.ls::before{content:'';width:.6em;height:.6em;border-radius:50%;background:currentColor;margin-inline-end:.5em}
.ls.on::before{border-radius:2px}
.ls:active{transform:scale(.92)}
.ls[data-st=prep]::before,.ls[data-st=play]::before{animation:pulse .8s infinite}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-weight:700;font-size:1.1rem;padding:12px 14px;border:2px solid var(--violet);border-radius:18px;
 background:var(--tint,var(--paper));color:var(--ink);cursor:pointer;animation:floaty 3s ease-in-out infinite}
.opt:nth-child(2){animation-delay:-.7s}.opt:nth-child(3){animation-delay:-1.4s}.opt:nth-child(4){animation-delay:-2.1s}
.opt:hover{background:var(--yellow);color:#1b1206}
.opt.ok{background:var(--cyan);color:var(--on);animation:cele .5s both}
.opt.bad{background:var(--pink);color:#fff;animation:shake .4s}
.go{border:0;border-radius:20px;background:var(--pink);color:#fff;font:inherit;font-weight:800;font-size:1.3rem;padding:14px;cursor:pointer}
.go:disabled{opacity:.5}
.msg{min-height:1.6em;font-weight:800;text-align:center;white-space:pre-line}
.card.cele{animation:cele .6s both;position:relative}
.card{position:relative}
.msg.big{font-size:2.5rem;font-weight:900;line-height:1.3;margin:.2em 0;
 background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));
 background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 2px 10px rgba(0,0,0,.25));
 animation:shine .9s linear infinite,pop2 .45s cubic-bezier(.2,.9,.3,1.4)}
@keyframes shine{to{background-position:300% 0}}
@keyframes pop2{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.flash{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle,#fff 0%,transparent 70%);
 opacity:0;pointer-events:none;z-index:5;animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.star{position:absolute;font-size:1.7rem;pointer-events:none;z-index:6;animation:starpop .9s ease-out both}
@keyframes starpop{0%{transform:translate(-50%,-50%) scale(0) rotate(0);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3) rotate(90deg);opacity:0}}
.win{position:absolute;inset:0;z-index:20;border-radius:inherit;overflow:hidden;display:grid;place-content:center;justify-items:center;gap:6px;text-align:center;
 background:radial-gradient(circle at 50% 36%,color-mix(in srgb,var(--yellow) 40%,transparent),transparent 62%),linear-gradient(160deg,color-mix(in srgb,var(--bg1) 92%,#000),color-mix(in srgb,var(--bg2) 92%,#000));
 animation:winIn .2s ease-out both}
@keyframes winIn{from{opacity:0}to{opacity:1}}
.win .medal{width:108px;height:108px;animation:medalPop .7s cubic-bezier(.2,1.4,.3,1) both;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
@keyframes medalPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
.win .t1{font-family:var(--display);font-size:4.3rem;font-weight:700;line-height:1.15;padding:0 .2em;
 background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35)) drop-shadow(0 4px 14px rgba(0,0,0,.5));
 animation:shine .9s linear infinite,pop2 .5s .08s cubic-bezier(.2,.9,.3,1.4) both}
.win .secs{display:flex;align-items:baseline;gap:.4em;padding:.05em .85em .2em;border-radius:999px;background:rgba(255,255,255,.14);
 border:2px solid color-mix(in srgb,var(--yellow) 85%,transparent);color:#fff;font-weight:800;direction:ltr;
 animation:pop2 .5s .22s both,blink .28s .62s 3}
.win .secs b{font-size:3.1rem;line-height:1.1;color:var(--yellow);font-variant-numeric:tabular-nums}
.win .secs span{font-size:1.25rem;direction:rtl}
@keyframes blink{50%{opacity:.12;transform:scale(1.14)}}
.pt{position:absolute;pointer-events:none;z-index:2;opacity:0;animation:fly 1s ease-out both}
.pt.star{width:26px;height:26px}.pt.star svg{width:100%;height:100%;display:block}
.pt.conf{width:9px;height:14px;border-radius:2px}
@keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}10%{opacity:1}70%{opacity:1}
 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(var(--rot))}}
.ad{border:2px dashed var(--ink);border-radius:14px;padding:8px;background:var(--cyan);color:var(--on)}
.ad-label{display:inline-block!important;visibility:visible!important;opacity:1!important;font-size:.75rem;font-weight:700;
 background:Canvas;color:CanvasText;padding:0 6px;border-radius:6px;margin-inline-end:6px}
:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.pick{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));inset-inline-start:12px;border:0;border-radius:999px;padding:8px 14px;font:inherit;font-weight:700;background:#fff;color:#222;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;z-index:9}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-3px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes cele{40%{transform:scale(1.06)}}
@keyframes pulse{50%{transform:scale(1.5);opacity:.4}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.opts.grid,.opts.mosaic{grid-template-columns:1fr 1fr}
.opts.circles{grid-template-columns:1fr 1fr;justify-items:center;gap:14px}
.opts.circles .opt{width:min(36vw,136px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;padding:8px}
.opts.mosaic .opt:nth-child(1){grid-column:span 2;border-radius:28px 8px 28px 8px}
.opts.mosaic .opt:nth-child(2){border-radius:8px 28px 8px 28px}
.opts.mosaic .opt:nth-child(3){border-radius:28px}
.opts.mosaic .opt:nth-child(4){grid-column:span 2;border-radius:8px 28px 8px 28px}
.mz{display:block;width:100%;touch-action:none;user-select:none;border-radius:16px}
.mz .w{fill:var(--violet)}.mz .p{fill:var(--paper)}
.mz text{font-family:var(--font);font-weight:700;font-size:3.1px;fill:var(--ink)}
.mz polyline{fill:none;stroke:var(--cyan);stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.mz circle{fill:var(--yellow);stroke:var(--violet);stroke-width:.8;animation:pulse 1s infinite;transform-box:fill-box;transform-origin:center}
.mz-bad{animation:shake .4s}
.pick.p2{bottom:calc(58px + env(safe-area-inset-bottom))}
.as{display:block;width:100%;touch-action:none;user-select:none;border-radius:16px;background:var(--paper)}
.as .ghost{fill:none;stroke:var(--ink);stroke-opacity:.35;stroke-width:1.6;stroke-dasharray:4 3}
.as .pc{cursor:grab;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.as .pc.locked{cursor:default;filter:none;opacity:.98}
.as .pc:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.as-bad{animation:shake .35s}
</style>

/* ===== 5) مدقّق القواعد (§4): أي مخالفة = رفض البناء ===== */
const SACRED_OK=['اختيار','ترتيب','توصيل هادئ'];
const ASSETS_OK=['سفن','خرائط','جبال','دراجات','غابات','أشكال هندسية'];
const REQ=['id','contentId','version','type','difficultyVariants','translatable','containsSacred','containsImagery','timerEnabled','adSlot','noWrongAnswer'];
function lint(c){
 const e=[];
 REQ.forEach(k=>{if(!(k in c))e.push('§2.1 حقل ناقص: '+k)});
 if(['requireFollow','requireMention','requireDM','gate'].some(k=>k in c))e.push('§4.1 ممنوع حجب النتيجة بشرط متابعة/نشر');
 if(c.id===c.contentId)e.push('§4.2 يجب أن يختلف id عن contentId، وأن يكون فريدًا لكل نشر');
 if(c.containsImagery&&!(c.assets||[]).every(a=>ASSETS_OK.includes(a)))e.push('§4.3 أصل بصري غير مسموح');
 if(c.containsSacred&&!SACRED_OK.includes(c.type))e.push('§4.4 آلية غير موقَّرة لمحتوى مقدّس');
 if(c.season&&c.seasonSource!=='manual')e.push('§4.5 المواسم يدوية فقط');
 if(c.captcha&&!(c.prize||c.competitive))e.push('§4.10 captcha محظور خارج الجوائز/التنافس العلني');
 if(c.usesSensors&&!c.fallback)e.push('§4.11 يلزم بديل بلا حساسات');
 if(!Core.types[c.type])e.push('نوع آلية غير مسجَّل: '+c.type);
 return e;
}

     فيظهر الحالي يمين المجموعة (أول ما تقع عليه العين عربيًا) والكل يسارها؛ في LTR يبقيان كما كُتبا (الحالي يسارًا).

/* ===== مفصل «متاهة»: حرّك إصبعك من النقطة الصفراء إلى المخرج الصحيح (ممرات بعرض خلية كاملة تتسع للإصبع) ===== */

 const at=(r,c)=>(G[r]||'')[c]||'#',ctr=(r,c)=>[c*U+U/2,r*U+U/2];

 const reset=()=>{pos=S.slice();trail=[ctr(S[0],S[1])];dead=0;draw()};
 function fail(){if(dead)return;dead=1;tries++;svg.classList.add('mz-bad');ev.onStepIncorrect(0,tries);later(()=>{svg.classList.remove('mz-bad');reset()},450)}

  pointerdown:e=>{if(done)return;const p=pt(e);if(at(Math.floor(p[1]),Math.floor(p[0]))!=='S')return;

    const pu=()=>{if(!on)return;on=0;const t=g.transform.baseVal.getItem(0).matrix;place(g,p,near(t.e,t.f,p.tx,p.ty))};
    const kd=e=>{if(p.locked||(e.key!=='Enter'&&e.key!==' '))return;e.preventDefault();place(g,p,true)};
    g.addEventListener('pointerdown',pd);g.addEventListener('pointermove',pm);
    g.addEventListener('pointerup',pu);g.addEventListener('pointercancel',pu);g.addEventListener('keydown',kd);
    offs.push(()=>{g.removeEventListener('pointerdown',pd);g.removeEventListener('pointermove',pm);
     g.removeEventListener('pointerup',pu);g.removeEventListener('pointercancel',pu);g.removeEventListener('keydown',kd)});
   });
   const b=core.bar(q.textContent);unsub=b.off;r.append(b.el,q,el);ev.onReady()},
  start(){t0=performance.now();ev.onModuleStart()},
  destroy(){unsub&&unsub();to.forEach(clearTimeout);to.length=0;offs.forEach(f=>f());offs.length=0}
 };
});

/* ===== 7) الإقلاع: بناء الحاوية، تدفق العودة، العدّاد، الإعلان ===== */
(function boot(){
 document.title=BRAND.name;try{speechSynthesis.getVoices()}catch(_){}
 const card=document.getElementById('card');let mod,done=false,t0=0,tId=0;
const fmt=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
 card.innerHTML=`<div class="top"><div class="brand">${BRAND.mascotIcon}<span></span></div><span class="ptimer"></span><button class="back-btn" type="button"></button></div>`;
const ptimer=card.querySelector(".ptimer");
 card.querySelector('.brand span').textContent=BRAND.name;
 const back=card.querySelector('.back-btn');back.textContent=U.back;
 if(BUILD.designPicker){let k=0;const b=$('button','pick');b.type='button';
  const up=()=>{b.textContent='🎨 '+(k+1)+'/'+LOOKS.length+' — '+LOOKS[k].n};
  b.onclick=()=>{k=(k+1)%LOOKS.length;theme(document.documentElement,LOOKS[k]);up()};up();document.body.append(b);
  const pi=PUZZLES.indexOf(PUZZLE),b2=$('button','pick p2');b2.type='button';b2.textContent='🧩 '+(pi+1)+'/'+PUZZLES.length+' — '+PUZZLE.type;
  b2.onclick=()=>{location.search='?p='+((pi+1)%PUZZLES.length)};document.body.append(b2)}
 const sz=BUILD.size;
 if(sz==='full'){card.style.setProperty('--w','100vw');card.style.setProperty('--h','100dvh');card.classList.add('full')}
 else if(sz&&sz.w){card.style.setProperty('--w',sz.w);card.style.setProperty('--h',sz.h)}
 const errs=lint(PUZZLE);
 if(errs.length){const p=$('div','msg');p.textContent=U.rejected+'\n'+errs.join('\n');card.append(p);return}
 const host=$('div');host.hidden=true;
 const go=$('button','go');go.type='button';go.textContent=U.start;go.disabled=true;
 const msg=$('p','msg');msg.setAttribute('aria-live','polite');
 card.append(host,go,msg);
 const mkAd=()=>{const a=$('aside','ad','<span class="ad-label"></span><span></span>');
  a.firstChild.textContent=U.ad;a.lastChild.textContent=PUZZLE.ad?(PUZZLE.ad[cLoc]||PUZZLE.ad.ar):'';
  if(BUILD.sponsorTheme)theme(PUZZLE.adSlot==='fullCard'?card:a,BUILD.sponsorTheme);return a};
 if(PUZZLE.adSlot==='inline'||PUZZLE.adSlot==='fullCard')card.insertBefore(mkAd(),go);
 function leave(){clearInterval(tId);try{mod&&mod.destroy()}catch(_){}
  if(window.speechSynthesis)window.speechSynthesis.cancel();location.href=BUILD.returnUrl}
/* شاشة الفوز: وسام + عنوان كبير متلوّن + الثواني تومض + نجوم وقصاصات — تجميعية لكل الألغاز */
 const STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.8l3.2 6.6 7.2 1-5.2 5.1 1.2 7.2L12 18.3 5.6 21.7l1.2-7.2L1.6 9.4l7.2-1z" fill="currentColor" stroke="rgba(0,0,0,.28)" stroke-width=".8" stroke-linejoin="round"/></svg>';
 const MEDAL='<svg class="medal" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="mg" cx=".38" cy=".33" r=".85"><stop offset="0" stop-color="#fff6bd"/><stop offset=".55" stop-color="#ffcf3f"/><stop offset="1" stop-color="#d98e0a"/></radialGradient></defs><path d="M27 2h17l9 30-16 8z" fill="#e2503f"/><path d="M73 2H56l-9 30 16 8z" fill="#2f6fe0"/><circle cx="50" cy="65" r="32" fill="url(#mg)" stroke="#b9770a" stroke-width="3"/><circle cx="50" cy="65" r="24.5" fill="none" stroke="#fff6bd" stroke-width="2" opacity=".85"/><path d="M50 46l5.7 11.6 12.8 1.9-9.3 9 2.2 12.7L50 75l-11.4 6.2 2.2-12.7-9.3-9 12.8-1.9z" fill="#fff9de" stroke="#b9770a" stroke-width="1.6" stroke-linejoin="round"/></svg>';
 function celebrate(sec){
  const win=$('div','win');win.setAttribute('role','status');
  win.innerHTML=MEDAL+'<div class="t1"></div>'+(sec==null?'':'<div class="secs"><b></b><span></span></div>');
  const t1=win.querySelector('.t1');t1.textContent=PUZZLE.noWrongAnswer?U.opinion:U.ok2;
  if(PUZZLE.noWrongAnswer)t1.style.fontSize='1.7rem';
  if(sec!=null){win.querySelector('.secs b').textContent=sec;win.querySelector('.secs span').textContent=U.sec}
  card.appendChild(win);
  const fl=$('div','flash');card.appendChild(fl);setTimeout(()=>fl.remove(),520);
  const cols=['var(--yellow)','var(--pink)','var(--cyan)','#ffffff'];
  for(let i=0;i<30;i++){
   const star=i<14,el=star?$('span','pt star'):$('i','pt conf');
   if(star)el.innerHTML=STAR;
   const ang=(i/30)*Math.PI*2+Math.random()*.3,dist=(star?110:80)+Math.random()*90;
   el.style.left='50%';el.style.top='36%';
   el.style.color=cols[i%4];if(!star)el.style.background=cols[i%4];
   el.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(0)+'px');
   el.style.setProperty('--dy',(Math.sin(ang)*dist*.9).toFixed(0)+'px');
   el.style.setProperty('--rot',((Math.random()*2-1)*360).toFixed(0)+'deg');
   el.style.animationDelay=(.12+i*.012).toFixed(3)+'s';
   win.appendChild(el)}
 }
 const ev={
  onReady(){go.disabled=false},
  onModuleStart(){t0=performance.now();
   if(PUZZLE.timerEnabled){ptimer.textContent=fmt(0);tId=setInterval(()=>ptimer.textContent=fmt(performance.now()-t0),250)}},
  onStepCorrect(){},onStepIncorrect(){},
  onModuleComplete(ms){
   if(done)return;done=true;clearInterval(tId);
   const s=Math.round((t0?performance.now()-t0:ms)/1000);
   msg.textContent=PUZZLE.noWrongAnswer?U.opinion:(PUZZLE.timerEnabled?U.done(s):U.ok);
   card.classList.add('cele');
   celebrate(PUZZLE.noWrongAnswer||!PUZZLE.timerEnabled?null:s);
   if(PUZZLE.adSlot==='postAnswer')card.insertBefore(mkAd(),msg);
   setTimeout(leave,BUILD.celebrateMs)},
  onExitRequested(){leave()}
 };
 back.onclick=()=>ev.onExitRequested();
 mod=Core.types[PUZZLE.type](PUZZLE,ev,Core);mod.mount(host);
 go.onclick=()=>{go.remove();host.hidden=false;mod.start()};go.click();   /* ضغطة المستخدم تفتح النطق (§3.6) */
 addEventListener('pagehide',()=>mod.destroy());
})();
</script>
